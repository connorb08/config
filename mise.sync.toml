# Run these from the checkout, wherever it is cloned (after `mise dot apply`):
#   Enable: mise -E sync bootstrap services apply
#   Check:  mise -E sync bootstrap services status
#   Remove: mise -E sync bootstrap services remove dotfiles-sync
[bootstrap.services.dotfiles-sync]
scope = "user"
description = "Commit, pull and push the dotfiles checkout every 10 minutes"
# Runs scripts/dotfiles-autosync.sh through its ~/.local/bin link, which finds
# the checkout and mise. The command holds no $: systemd would expand it itself.
# macOS/Linux only (needs /bin/sh).
command = "/bin/sh -c 'exec ~/.local/bin/dotfiles-autosync'"
restart = "always"
requires_tools = true

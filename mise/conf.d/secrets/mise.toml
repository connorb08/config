# gopass as the credential store: secrets are encrypted with age and kept in
# a git repository that every machine clones.
#
#   first machine      mise run gopass:init
#   every later one    mise run gopass:join
#
# gopass rewrites its own config file, so it is configured through its CLI
# instead of a deployed file.

[vars]
# Git URL of the password store repository (keep it private). Set it in a
# machine-specific mise.local.toml at the repository root.
gopass_store = { default = "" }

[dotfiles."fnox/config.toml"]
source = "../../../dotfiles/fnox/config.toml"
mode = "symlink"
variants = [
  { os = "unix", target = "~/.config/fnox/config.toml" },
  { os = "windows", target = "~/AppData/Local/fnox/config.toml" },
]

# Part of `mise bootstrap`. Never prompts: creating a store and unlocking
# keys need you at the keyboard, which gopass:init and gopass:join are for.
[tasks."setup:gopass"]
description = "Apply gopass settings and say what is left to do"
shell = "nu -c"
run = '''
# Settings applied with `gopass config <key> <value>`.
let settings = {
    "core.autosync": "true"       # pull and push the store regularly
    "core.cliptimeout": "45"      # seconds until a copied secret leaves the clipboard
    "core.notifications": "false"
    "generate.length": "32"
}
for row in ($settings | transpose key value) {
    ^gopass config $row.key $row.value | ignore
}

# gopass always reports a store path; the store is there once it is a git checkout.
let store = ((^gopass config mounts.path | complete).stdout | str trim)
let mounted = (($store | is-not-empty) and ($store | path expand | path join ".git" | path exists))
if $mounted {
    print "gopass: password store present"
} else if ("{{ vars.gopass_store }}" | is-empty) {
    print "gopass: no store yet. Set the gopass_store var, then run"
    print "          mise run gopass:init   on the first machine"
    print "          mise run gopass:join   on every later one"
} else {
    print "gopass: no store on this machine yet; run `mise run gopass:join`"
}
'''

[tasks."gopass:init"]
description = "Create a new age-encrypted password store (first machine only)"
shell = "nu -c"
raw = true
run = '''
let remote = "{{ vars.gopass_store }}"

# Generates this machine's age key (you choose its passphrase) and an empty
# store kept in git. Skipped when the store is already there, so this can be
# run again later to attach a remote.
let store = ((^gopass config mounts.path | complete).stdout | str trim)
if not (($store | is-not-empty) and ($store | path expand | path join ".git" | path exists)) {
    ^gopass setup --crypto age --storage gitfs
}

if ($remote | is-empty) {
    print "gopass: store created, on this machine only. To share it, create a private"
    print "        repository, set the gopass_store var to its URL and run this again."
} else {
    if (^gopass git remote get-url origin | complete).exit_code != 0 {
        ^gopass git remote add origin $remote
    }
    ^gopass sync
    print $"gopass: store created and pushed to ($remote)"
}
'''

[tasks."gopass:join"]
description = "Clone the password store and print this machine's key to authorize"
shell = "nu -c"
raw = true
run = '''
let remote = "{{ vars.gopass_store }}"
if ($remote | is-empty) {
    print --stderr "gopass: set the gopass_store var to the store's git URL first"
    exit 1
}

# This machine's own age key. Its public half is what the other machines
# encrypt to; the private half never leaves this machine.
let config_dir = (if $nu.os-info.name == "windows" { $env.APPDATA } else { $nu.home-dir | path join ".config" })
if not ($config_dir | path join "gopass" "age" "identities" | path exists) {
    ^gopass age identities keygen
}

# gopass always reports a store path; the store is there once it is a git checkout.
let store = ((^gopass config mounts.path | complete).stdout | str trim)
let mounted = (($store | is-not-empty) and ($store | path expand | path join ".git" | path exists))
if not $mounted {
    # A fixed path, the one `gopass setup` uses: left to choose, gopass clones to
    # ~/.password-store, which may already hold an older pass/gopass store.
    let path = (if $nu.os-info.name == "windows" {
        $env.LOCALAPPDATA | path join "gopass" "stores" "root"
    } else {
        $nu.home-dir | path join ".local" "share" "gopass" "stores" "root"
    })
    if ($path | path exists) and (ls -a $path | is-not-empty) {
        print --stderr $"gopass: ($path) exists but is not a password store checkout; move it aside and run this again"
        exit 1
    }
    ^gopass --yes clone --crypto age --path $path $remote
}

let recipient = (^gopass age identities | parse --regex '(?<key>age1[0-9a-z]+)' | get key | first)
print ""
print "gopass: this machine cannot read the store until a machine that can adds its key."
print "        On a machine that already has access, run:"
print ""
print $"          gopass recipients add ($recipient)"
print "          gopass sync"
print ""
print "        then here: gopass sync"
'''


# Generated by scripts/palette.nu from templates/dotfiles/yazi/flavors/one-monokai-darker.yazi/flavor.toml.tmpl and palette.toml; edit those, not this file.
# One Monokai Darker, adapted from yazi-rs/flavors (MIT).
# UI greys as in the VS Code theme (active tab #262c36, selection #2c3340);
# blue (#4dafff, the theme's class colour) for directories, as in eza;
# cyan marks select mode and state.
# Purple is kept to a single folder icon.
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#4dafff" }

# Find
find_keyword  = { fg = "#f5d273", bold = true, italic = true, underline = true }
find_position = { fg = "#ff505e", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#8cc761", bg = "#8cc761" }
marker_cut      = { fg = "#ff505e", bg = "#ff505e" }
marker_marked   = { fg = "#32b8c9", bg = "#32b8c9" }
marker_selected = { fg = "#f5d273", bg = "#f5d273" }

# Count
count_copied   = { fg = "#191c22", bg = "#8cc761" }
count_cut      = { fg = "#191c22", bg = "#ff505e" }
count_selected = { fg = "#191c22", bg = "#f5d273" }

# Border
border_symbol = "│"
border_style  = { fg = "#676f7d" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#d7dae0", bg = "#262c36", bold = true }
inactive = { fg = "#9da5b4", bg = "#13161b" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#d7dae0", bg = "#2c3340", bold = true }
normal_alt  = { fg = "#9da5b4", bg = "#262c36" }

# Select mode
select_main = { fg = "#191c22", bg = "#32b8c9", bold = true }
select_alt  = { fg = "#32b8c9", bg = "#262c36" }

# Unset mode
unset_main = { fg = "#191c22", bg = "#f5d273", bold = true }
unset_alt  = { fg = "#f5d273", bg = "#262c36" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#676f7d" }
perm_type  = { fg = "#32b8c9" }
perm_read  = { fg = "#f5d273" }
perm_write = { fg = "#ff505e" }
perm_exec  = { fg = "#8cc761" }

# Progress
progress_label  = { fg = "#d7dae0", bold = true }
progress_normal = { fg = "#8cc761", bg = "#4e5666" }
progress_error  = { fg = "#f5d273", bg = "#ff505e" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#4e5666" }
active   = { fg = "#ff505e", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#4e5666" }
title    = {}
value    = {}
hint     = { fg = "#676f7d", italic = true }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#4e5666" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#4e5666" }
title   = {}
hovered = { fg = "#ff505e", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#4e5666" }
cand            = { fg = "#32b8c9" }
rest            = { fg = "#9da5b4" }
desc            = { fg = "#ff505e" }
separator       = "  "
separator_style = { fg = "#676f7d" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#32b8c9" }
run     = { fg = "#ff505e" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#262c36", bg = "#abb2bf" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#4e5666" }
title    = { fg = "#abb2bf" }
tbl_col  = { fg = "#32b8c9" }
tbl_cell = { fg = "#ff505e", bg = "#4e5666" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#8cc761" }
title_warn  = { fg = "#f5d273" }
title_error = { fg = "#ff505e" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#32b8c9" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#f5d273" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff505e" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8cc761" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#9da5b4" },
	# Fallback
	{ url = "*", fg = "#abb2bf" },
	{ url = "*/", fg = "#4dafff" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#ff505e" },
	{ name = ".git", text = "", fg = "#4dafff" },
	{ name = ".github", text = "", fg = "#da61fe" },
	{ name = ".npm", text = "", fg = "#ff505e" },
	{ name = "Desktop", text = "", fg = "#4dafff" },
	{ name = "Development", text = "", fg = "#4dafff" },
	{ name = "Documents", text = "", fg = "#4dafff" },
	{ name = "Downloads", text = "", fg = "#4dafff" },
	{ name = "Library", text = "", fg = "#4dafff" },
	{ name = "Movies", text = "", fg = "#4dafff" },
	{ name = "Music", text = "", fg = "#4dafff" },
	{ name = "Pictures", text = "", fg = "#4dafff" },
	{ name = "Public", text = "", fg = "#4dafff" },
	{ name = "Videos", text = "", fg = "#4dafff" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#abb2bf" },
	{ if = "link", text = "", fg = "#7f848e" },
	{ if = "block", text = "", fg = "#f5d273" },
	{ if = "char", text = "", fg = "#f5d273" },
	{ if = "fifo", text = "", fg = "#f5d273" },
	{ if = "sock", text = "", fg = "#f5d273" },
	{ if = "sticky", text = "", fg = "#f5d273" },
	{ if = "dummy", text = "", fg = "#ff505e" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#4dafff" },
	{ if = "dir", text = "", fg = "#4dafff" },
	{ if = "exec", text = "", fg = "#8cc761" },
	{ if = "!dir", text = "", fg = "#abb2bf" },
]

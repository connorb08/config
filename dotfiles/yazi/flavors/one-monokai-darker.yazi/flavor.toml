# Generated by scripts/palette.nu from templates/dotfiles/yazi/flavors/one-monokai-darker.yazi/flavor.toml.tmpl and palette.toml; edit those, not this file.
# One Monokai Darker, adapted from yazi-rs/flavors (MIT).
# UI greys as in the VS Code theme (active tab #20252e, selection #252b36);
# blue (#61b8ff, the theme's class colour) for directories, as in eza;
# cyan marks select mode and state.
# Purple is kept to a single folder icon.
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#61b8ff" }

# Find
find_keyword  = { fg = "#f9df6f", bold = true, italic = true, underline = true }
find_position = { fg = "#fb598a", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#97cc70", bg = "#97cc70" }
marker_cut      = { fg = "#fb598a", bg = "#fb598a" }
marker_marked   = { fg = "#40bfcf", bg = "#40bfcf" }
marker_selected = { fg = "#f9df6f", bg = "#f9df6f" }

# Count
count_copied   = { fg = "#15181d", bg = "#97cc70" }
count_cut      = { fg = "#15181d", bg = "#fb598a" }
count_selected = { fg = "#15181d", bg = "#f9df6f" }

# Border
border_symbol = "│"
border_style  = { fg = "#656d7a" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#d7dae0", bg = "#20252e", bold = true }
inactive = { fg = "#8a93a5", bg = "#101317" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#d7dae0", bg = "#252b36", bold = true }
normal_alt  = { fg = "#8a93a5", bg = "#20252e" }

# Select mode
select_main = { fg = "#15181d", bg = "#40bfcf", bold = true }
select_alt  = { fg = "#40bfcf", bg = "#20252e" }

# Unset mode
unset_main = { fg = "#15181d", bg = "#f9df6f", bold = true }
unset_alt  = { fg = "#f9df6f", bg = "#20252e" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#656d7a" }
perm_type  = { fg = "#40bfcf" }
perm_read  = { fg = "#f9df6f" }
perm_write = { fg = "#fb598a" }
perm_exec  = { fg = "#97cc70" }

# Progress
progress_label  = { fg = "#d7dae0", bold = true }
progress_normal = { fg = "#97cc70", bg = "#464d5c" }
progress_error  = { fg = "#f9df6f", bg = "#fb598a" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#464d5c" }
active   = { fg = "#fb598a", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#464d5c" }
title    = {}
value    = {}
hint     = { fg = "#656d7a", italic = true }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#464d5c" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#464d5c" }
title   = {}
hovered = { fg = "#fb598a", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#464d5c" }
cand            = { fg = "#40bfcf" }
rest            = { fg = "#8a93a5" }
desc            = { fg = "#fb598a" }
separator       = "  "
separator_style = { fg = "#656d7a" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#40bfcf" }
run     = { fg = "#fb598a" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#20252e", bg = "#abb2bf" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#464d5c" }
title    = { fg = "#abb2bf" }
tbl_col  = { fg = "#40bfcf" }
tbl_cell = { fg = "#fb598a", bg = "#464d5c" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#97cc70" }
title_warn  = { fg = "#f9df6f" }
title_error = { fg = "#fb598a" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#40bfcf" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#f9df6f" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fb598a" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#97cc70" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#8a93a5" },
	# Fallback
	{ url = "*", fg = "#abb2bf" },
	{ url = "*/", fg = "#61b8ff" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#fb598a" },
	{ name = ".git", text = "", fg = "#61b8ff" },
	{ name = ".github", text = "", fg = "#df75fe" },
	{ name = ".npm", text = "", fg = "#fb598a" },
	{ name = "Desktop", text = "", fg = "#61b8ff" },
	{ name = "Development", text = "", fg = "#61b8ff" },
	{ name = "Documents", text = "", fg = "#61b8ff" },
	{ name = "Downloads", text = "", fg = "#61b8ff" },
	{ name = "Library", text = "", fg = "#61b8ff" },
	{ name = "Movies", text = "", fg = "#61b8ff" },
	{ name = "Music", text = "", fg = "#61b8ff" },
	{ name = "Pictures", text = "", fg = "#61b8ff" },
	{ name = "Public", text = "", fg = "#61b8ff" },
	{ name = "Videos", text = "", fg = "#61b8ff" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#abb2bf" },
	{ if = "link", text = "", fg = "#727781" },
	{ if = "block", text = "", fg = "#f9df6f" },
	{ if = "char", text = "", fg = "#f9df6f" },
	{ if = "fifo", text = "", fg = "#f9df6f" },
	{ if = "sock", text = "", fg = "#f9df6f" },
	{ if = "sticky", text = "", fg = "#f9df6f" },
	{ if = "dummy", text = "", fg = "#fb598a" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#61b8ff" },
	{ if = "dir", text = "", fg = "#61b8ff" },
	{ if = "exec", text = "", fg = "#97cc70" },
	{ if = "!dir", text = "", fg = "#abb2bf" },
]

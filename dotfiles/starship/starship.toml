# Starship prompt, shared by zsh, bash, fish and nushell.
#
#   󰈺 fish  config  main !2 ?1                                3s
#   ❯
#
# Line 1 is which shell this is, where you are (directory, git branch and
# state), then on the right how long the last command took.
# Line 2 is the prompt character, green or red for the last command's result.
# The user and host appear only over SSH.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "one_monokai_darker"

format = """
[](bg_panel)\
$shell\
$directory\
[](fg:bg_panel bg:bg_accent)\
$git_branch\
$git_status\
[](fg:bg_accent)\
$fill\
$cmd_duration\
$line_break\
$character"""

# One Monokai Darker, matching dotfiles/wezterm/theme.lua and tmux.conf.
[palettes.one_monokai_darker]
bg_dark = "#13161b"
bg_panel = "#262c36"
bg_accent = "#2c3340"
fg = "#abb2bf"
muted = "#676f7d"
red = "#ff505e"
yellow = "#f1bd5b"
green = "#8cc761"
cyan = "#32b8c9"
purple = "#da61fe"
orange = "#e49346"


[directory]
style = "bold cyan bg:bg_panel"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold purple bg:bg_accent"
format = "[ $branch ]($style)"

[git_status]
style = "bold yellow bg:bg_accent"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
style = "muted"
format = "[$duration]($style)"

# Which shell this prompt belongs to, inside the pill before the directory,
# each in its own color; fish gets a
# little fish. The indicators are format strings, so they carry their style.
# Icons are Nerd Font glyphs; Nerd Fonts has no Nushell icon, so nu gets a terminal.
[shell]
disabled = false
format = "[ ](bg:bg_panel)$indicator[ ](fg:muted bg:bg_panel)"
fish_indicator = "[󰈺 fish](bold cyan bg:bg_panel)"
nu_indicator = "[ nu](bold green bg:bg_panel)"
zsh_indicator = "[ zsh](bold purple bg:bg_panel)"
bash_indicator = "[ bash](bold orange bg:bg_panel)"
powershell_indicator = "[󰨊 pwsh](bold muted bg:bg_panel)"
unknown_indicator = "[?](muted bg:bg_panel)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"





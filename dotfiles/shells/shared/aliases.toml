optional = ["ls", "ll", "la", "lt", "cat", "grep", "find"]

[aliases]
ls = ["eza", "--icons=auto", "--group-directories-first"]
ll = ["eza", "-l", "--icons=auto", "--group-directories-first", "--git"]
la = ["eza", "-la", "--icons=auto", "--group-directories-first", "--git"]
lt = ["eza", "--tree", "--level=2", "--icons=auto", "--group-directories-first"]
cat = ["bat", "--paging=never"]
grep = ["rg"]
find = ["fd"]
o = ["nvim"]
g = ["git"]
python = ["python3"]
pip = ["pip3"]
".." = ["cd", ".."]
"..." = ["cd", "../.."]

# Git shortcuts from Oh My Zsh's git plugin, in every shell: each is `git <args>`
# (fish expands them as abbreviations). Shortcuts that need shell code, such as
# gcm (checkout the main branch) or ggpush, stay in bash/bashrc.d/git.sh.
[git]
ga = ["add"]
gaa = ["add", "--all"]
gapa = ["add", "--patch"]
gau = ["add", "--update"]
gav = ["add", "--verbose"]
gam = ["am"]
gama = ["am", "--abort"]
gamc = ["am", "--continue"]
gamscp = ["am", "--show-current-patch"]
gams = ["am", "--skip"]
gap = ["apply"]
gapt = ["apply", "--3way"]
gbs = ["bisect"]
gbsb = ["bisect", "bad"]
gbsg = ["bisect", "good"]
gbsn = ["bisect", "new"]
gbso = ["bisect", "old"]
gbsr = ["bisect", "reset"]
gbss = ["bisect", "start"]
gbl = ["blame", "-w"]
gb = ["branch"]
gba = ["branch", "--all"]
gbd = ["branch", "--delete"]
gbD = ["branch", "--delete", "--force"]
gbm = ["branch", "--move"]
gbnm = ["branch", "--no-merged"]
gbr = ["branch", "--remotes"]
gco = ["checkout"]
gcor = ["checkout", "--recurse-submodules"]
gcb = ["checkout", "-b"]
gcB = ["checkout", "-B"]
gcp = ["cherry-pick"]
gcpa = ["cherry-pick", "--abort"]
gcpc = ["cherry-pick", "--continue"]
gclean = ["clean", "--interactive", "-d"]
gcl = ["clone", "--recurse-submodules"]
gclf = ["clone", "--recursive", "--shallow-submodules", "--filter=blob:none", "--also-filter-submodules"]
gcam = ["commit", "--all", "--message"]
gcas = ["commit", "--all", "--signoff"]
gcasm = ["commit", "--all", "--signoff", "--message"]
gcs = ["commit", "--gpg-sign"]
gcss = ["commit", "--gpg-sign", "--signoff"]
gcssm = ["commit", "--gpg-sign", "--signoff", "--message"]
gcmsg = ["commit", "--message"]
gcsm = ["commit", "--signoff", "--message"]
gc = ["commit", "--verbose"]
gca = ["commit", "--verbose", "--all"]
gcn = ["commit", "--verbose", "--no-edit"]
gcf = ["config", "--list"]
gcfu = ["commit", "--fixup"]
gd = ["diff"]
gdca = ["diff", "--cached"]
gdcw = ["diff", "--cached", "--word-diff"]
gds = ["diff", "--staged"]
gdw = ["diff", "--word-diff"]
gdt = ["diff-tree", "--no-commit-id", "--name-only", "-r"]
gf = ["fetch"]
gfo = ["fetch", "origin"]
gg = ["gui", "citool"]
gga = ["gui", "citool", "--amend"]
ghh = ["help"]
glgg = ["log", "--graph"]
glgga = ["log", "--graph", "--decorate", "--all"]
glgm = ["log", "--graph", "--max-count=10"]
glo = ["log", "--oneline", "--decorate"]
glog = ["log", "--oneline", "--decorate", "--graph"]
gloga = ["log", "--oneline", "--decorate", "--graph", "--all"]
glg = ["log", "--stat"]
glgp = ["log", "--stat", "--patch"]
gm = ["merge"]
gma = ["merge", "--abort"]
gmc = ["merge", "--continue"]
gmtl = ["mergetool", "--no-prompt"]
gmtlvim = ["mergetool", "--no-prompt", "--tool=vimdiff"]
gl = ["pull"]
gpr = ["pull", "--rebase"]
gprv = ["pull", "--rebase", "-v"]
gpra = ["pull", "--rebase", "--autostash"]
gprav = ["pull", "--rebase", "--autostash", "-v"]
gp = ["push"]
gpd = ["push", "--dry-run"]
gpv = ["push", "--verbose"]
gpod = ["push", "origin", "--delete"]
gpu = ["push", "upstream"]
grb = ["rebase"]
grba = ["rebase", "--abort"]
grbc = ["rebase", "--continue"]
grbi = ["rebase", "--interactive"]
grbo = ["rebase", "--onto"]
grbs = ["rebase", "--skip"]
grf = ["reflog"]
gr = ["remote"]
grv = ["remote", "--verbose"]
gra = ["remote", "add"]
grrm = ["remote", "remove"]
grmv = ["remote", "rename"]
grset = ["remote", "set-url"]
grup = ["remote", "update"]
grh = ["reset"]
gru = ["reset", "--"]
grhh = ["reset", "--hard"]
grhk = ["reset", "--keep"]
grhs = ["reset", "--soft"]
grs = ["restore"]
grss = ["restore", "--source"]
grst = ["restore", "--staged"]
grev = ["revert"]
greva = ["revert", "--abort"]
grevc = ["revert", "--continue"]
grm = ["rm"]
grmc = ["rm", "--cached"]
gcount = ["shortlog", "--summary", "--numbered"]
gsh = ["show"]
gsps = ["show", "--pretty=short", "--show-signature"]
gstall = ["stash", "--all"]
gstaa = ["stash", "apply"]
gstc = ["stash", "clear"]
gstd = ["stash", "drop"]
gstl = ["stash", "list"]
gstp = ["stash", "pop"]
gsts = ["stash", "show", "--patch"]
gs = ["status"]
gst = ["status"]
gss = ["status", "--short"]
gsb = ["status", "--short", "--branch"]
gsi = ["submodule", "init"]
gsu = ["submodule", "update"]
gsd = ["svn", "dcommit"]
gsr = ["svn", "rebase"]
gsw = ["switch"]
gswc = ["switch", "--create"]
gta = ["tag", "--annotate"]
gts = ["tag", "--sign"]
gignore = ["update-index", "--assume-unchanged"]
gunignore = ["update-index", "--no-assume-unchanged"]
gwch = ["log", "--patch", "--abbrev-commit", "--pretty=medium", "--raw"]
gwt = ["worktree"]
gwta = ["worktree", "add"]
gwtls = ["worktree", "list"]
gwtmv = ["worktree", "move"]
gwtrm = ["worktree", "remove"]
gfa = ["fetch", "--all", "--tags", "--prune", "--jobs=10"]
gpf = ["push", "--force-with-lease", "--force-if-includes"]
gsta = ["stash", "push"]
gstu = ["stash", "push", "--include-untracked"]

[fish]
abbreviations = ["o", "g"]
excluded = ["..", "..."]

[nushell]
excluded = ["ls", "find", "python", "pip", "..", "..."]
native = ["ll", "la"]

[nushell.overrides]
ll = ["ls", "-l"]
la = ["ls", "-la"]

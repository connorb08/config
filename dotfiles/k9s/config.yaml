k9s:
  liveViewAutoRefresh: false
  refreshRate: 2
  apiServerTimeout: 15s
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  portForwardAddress: localhost
  ui:
    skin: one-monokai-darker
    enableMouse: false
    headless: false
    logoless: true
    crumbsless: false
    splashless: true
    reactive: true
    noIcons: false
  skipLatestRevCheck: true
  disablePodCounting: false
  logger:
    tail: 200
    buffer: 5000
    sinceSeconds: -1
    textWrap: false
    showTime: false
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70

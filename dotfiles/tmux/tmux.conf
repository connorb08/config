# tmux 3.2+. Keep the default Ctrl-b prefix; prefix+r reloads this file.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
set -g set-clipboard external
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# One Monokai Darker: terminal colors and the source theme's syntax accents.
set -g pane-border-style "fg=#3b4048"
set -g pane-active-border-style "fg=#4dafff"
set -g message-style "fg=#abb2bf,bg=#262c36"
setw -g mode-style "fg=#d7dae0,bg=#2c3340"
set -g status-style "fg=#9da5b4,bg=#13161b"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[fg=#8cc761,bold] #S #[default]#{?client_prefix,#[fg=#f1bd5b] PREFIX ,}"
set -g status-right "#{?window_zoomed_flag,#[fg=#e49346] zoom ,}#[fg=#9da5b4]%a %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#4dafff,bg=#262c36,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#f1bd5b"
setw -g monitor-activity on
set -g visual-activity off
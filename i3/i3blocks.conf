# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=10
markup=none
color=#ffffff


#[bandwidth]
#instance=wlp2s0
#interval=1



#[ssid]
#label=
#command=iw dev wlp2s0 link | grep SSID | cut -d " " -f 2- && ifconfig | grep -Eo 'inet (addr:)?([0-9]*\.){3}[0-9]*' | grep -Eo '([0-9]*\.){3}[0-9]*' | grep -v '127.0.0.1'
#color=#33ccff
#interval=5
#separator=false

[iface]
instance=wlp2s0
color=#33ccff
interval=10
separator=true
label=



#[disk-io]
#label= 
#command=/home/connor/.config/i3/scripts/disk-io
#command=$SCRIPT_DIR/disk-io -w 3 -M -P 0
#interval=persist
#markup=pango
#instance=/^sda/



[memory]
label=Memory:
separator=true
interval=30
color=#adff2f

[memory]
label= 
instance=swap
separator=true
interval=30
color=#adff2f

[disk]
label=
instance=/dev/sda1
interval=30
color=#adff2f

[cpu_usage]
label=CPU:
interval=10
#min_width=CPU: 100.00%
separator=true
color=#adff2f


[temp]
command=sensors coretemp-isa-0000 | awk '/Physical/ {print $4}'
label=Temp:
interval=10
color=#adff2f


# Disk usage
#
# The directory defaults to $HOME if the instance is not specified.
# The script may be called with a optional argument to set the alert
# (defaults to 10 for 10%).
#[disk]
#label=HOME
#instance=/mnt/data
#interval=30

# Battery indicator
#
# The battery instance defaults to 0.
[battery]
label=
instance=0
interval=30
color=#ffff00


[Weather]
command=~/.config/i3/scripts/weather.sh "04021"
interval=1800
color=#df80ff


# Date Time
#
[time]
command=date '+%B %d %l:%M:%S'
interval=1
color=#df80ff


# Generic media player support
#
# This displays "ARTIST - SONG" if a music is playing.
# Supported players are: spotify, vlc, audacious, xmms2, mplayer, and others.
#[mediaplayer]
#instance=spotify
#interval=5
#signal=10

# OpenVPN support
#
# Support multiple VPN, with colors.
#[openvpn]
#interval=20

# Temperature
#
# Support multiple chips, though lm-sensors.
# The script may be called with -w and -c switches to specify thresholds,
# see the script for details.
#[temperature]
#label=TEMP
#interval=10


# One Monokai Darker: the one place every tool's colours come from.
#
# Templates under templates/ name these colours instead of writing hex values:
#   {{ yellow }}       -> #f1bd5b      (most configs)
#   {{ yellow.bare }}  -> f1bd5b       (fish themes)
#   {{ yellow.rgb }}   -> 241;189;91   (terminal escape codes, e.g. JQ_COLORS)
# scripts/palette.nu renders them into the real files under dotfiles/. Change a
# colour here and run `mise run palette`; the dotfiles sync does it too.
#
# The VS Code theme is generated from these too (dotfiles/vscode); the setting
# each colour is used for there is noted.

[colors]
# ---- backgrounds, darkest to lightest
bg_darkest = "#0a0b0d"   # editorGroup.border, tab.border
bg_dark    = "#0e1114"   # sideBar, statusBar, inactive tabs
bg         = "#12151a"   # editor.background
hover      = "#1a1d24"   # list.activeSelectionBackground
line       = "#1c2128"   # editor.lineHighlight, active tab
selection  = "#212630"   # editor.selectionBackground
search     = "#27344d"   # editor.findMatchBackground

# ---- text and UI greys
fg         = "#abb2bf"   # terminal.foreground, ordinary text
fg_bright  = "#d7dae0"   # selected list items, ansiWhite
fg_dim     = "#7c869a"   # statusBar.foreground
comment    = "#636b78"   # comments
grey       = "#696d77"   # ansiBrightBlack
scrollbar  = "#404755"   # scrollbarSlider
gutter     = "#3d4351"   # editorLineNumber.foreground
whitespace = "#3c3e42"   # editorWhitespace.foreground
border     = "#31353c"   # editorIndentGuide, pane borders
black      = "#21252a"   # ansiBlack
cursor     = "#f8f8f0"   # editorCursor.foreground
white      = "#ffffff"

# ---- syntax and terminal colours
red         = "#ff5a67"  # keywords, storage, tags
red_bright  = "#ff4646"  # ansiBrightRed
red_dark    = "#d9352a"  # editorError.foreground
orange      = "#f59740"  # function parameters
yellow      = "#f9df6f"  # strings
green       = "#8fd959"  # functions, inherited classes
cyan        = "#25cbe0"  # types, constants, JSON keys
blue        = "#57b3ff"  # classes, variables, links
blue_ansi   = "#5c92ff"  # ansiBlue, badges and buttons
purple      = "#b96aff"  # numbers, ansiMagenta
purple_dark = "#8600a1"  # ansiBrightMagenta

# ---- VS Code only (one-monokai-darker.json UI)
bg_input         = "#0c0d11"  # dropdown.background, input.background
bg_activity      = "#15181e"  # activityBar.background, debugToolBar
list_hover       = "#161a20"  # list.hoverBackground
search_other     = "#1b263b"  # editor.findMatchHighlightBackground
ruler            = "#3c3c3c"  # editorRuler.foreground
scrollbar_hover  = "#4b5261"  # scrollbarSlider.hoverBackground
scrollbar_active = "#606779"  # scrollbarSlider.activeBackground
title_inactive   = "#585e67"  # titleBar.inactiveForeground
list_highlight   = "#c5c5c5"  # list.highlightForeground
badge_fg         = "#f8fafd"  # activityBarBadge.foreground
teal             = "#0089a5"  # diffEditor.insertedTextBackground (with alpha)
true_black       = "#000000"  # editorUnnecessaryCode.opacity (with alpha)

# ---- from the theme's legacy token rules
invalid            = "#c678dd"
invalid_deprecated = "#56b6c2"
diff_header        = "#75715e"

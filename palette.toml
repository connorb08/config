# One Monokai Darker: the one place every tool's colours come from.
#
# Templates under templates/ name these colours instead of writing hex values:
#   {{ yellow }}       -> #f1bd5b      (most configs)
#   {{ yellow.bare }}  -> f1bd5b       (fish themes)
#   {{ yellow.rgb }}   -> 241;189;91   (terminal escape codes, e.g. JQ_COLORS)
# scripts/palette.nu renders them into the real files under dotfiles/. Change a
# colour here and run `mise run palette`; the dotfiles sync does it too.
#
# The VS Code theme is generated from these too (dotfiles/vscode); the setting
# each colour is used for there is noted.

[colors]
# ---- backgrounds, darkest to lightest
bg_darkest = "#0b0d0f"   # editorGroup.border, tab.border
bg_dark    = "#101317"   # sideBar, statusBar, inactive tabs
bg         = "#15181d"   # editor.background
hover      = "#1d2129"   # list.activeSelectionBackground
line       = "#20252e"   # editor.lineHighlight, active tab
selection  = "#252b36"   # editor.selectionBackground
search     = "#2c3b57"   # editor.findMatchBackground

# ---- text and UI greys
fg         = "#abb2bf"   # terminal.foreground, ordinary text
fg_bright  = "#d7dae0"   # selected list items, ansiWhite
fg_dim     = "#8a93a5"   # statusBar.foreground
comment    = "#656d7a"   # comments
grey       = "#727781"   # ansiBrightBlack
scrollbar  = "#464d5c"   # scrollbarSlider
gutter     = "#424958"   # editorLineNumber.foreground
whitespace = "#414348"   # editorWhitespace.foreground
border     = "#353a41"   # editorIndentGuide, pane borders
black      = "#262a30"   # ansiBlack
cursor     = "#f8f8f0"   # editorCursor.foreground
white      = "#ffffff"

# ---- syntax and terminal colours
red         = "#fb598a"  # keywords, storage, tags
red_bright  = "#f55a5a"  # ansiBrightRed
red_dark    = "#c94d45"  # editorError.foreground
orange      = "#e79d58"  # function parameters
yellow      = "#f7e187"  # strings
green       = "#97cc70"  # functions, inherited classes
cyan        = "#40bfcf"  # types, constants, JSON keys
blue        = "#61b8ff"  # classes, variables, links
blue_ansi   = "#6699ff"  # ansiBlue, badges and buttons
purple      = "#df75fe"  # numbers, ansiMagenta
purple_dark = "#8f00ab"  # ansiBrightMagenta

# ---- VS Code only (one-monokai-darker.json UI)
bg_input         = "#0e0f13"  # dropdown.background, input.background
bg_activity      = "#181b22"  # activityBar.background, debugToolBar
list_hover       = "#191d24"  # list.hoverBackground
search_other     = "#1f2b43"  # editor.findMatchHighlightBackground
ruler            = "#414141"  # editorRuler.foreground
scrollbar_hover  = "#515969"  # scrollbarSlider.hoverBackground
scrollbar_active = "#687083"  # scrollbarSlider.activeBackground
title_inactive   = "#606670"  # titleBar.inactiveForeground
list_highlight   = "#c5c5c5"  # list.highlightForeground
badge_fg         = "#f8fafd"  # activityBarBadge.foreground
teal             = "#0091af"  # diffEditor.insertedTextBackground (with alpha)
true_black       = "#000000"  # editorUnnecessaryCode.opacity (with alpha)

# ---- from the theme's legacy token rules
invalid            = "#c678dd"
invalid_deprecated = "#56b6c2"
diff_header        = "#75715e"
